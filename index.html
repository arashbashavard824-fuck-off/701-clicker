<!DOCTYPE html>  
<html lang="fa" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1.0">  
<title>انگشتش کن!</title>  
<style>  
  
*{  
    margin:0;  
    padding:0;  
    box-sizing:border-box;  
    font-family:tahoma;  
}  
  
body{  
    background:#111;  
    color:white;  
    display:flex;  
    justify-content:center;  
    align-items:flex-start;  
    min-height:100vh;  
    overflow:auto;  
    padding:20px 0;  
}  
  
#game{  
    width:390px;  
    max-width:95%;  
    background:#222;  
    border-radius:20px;  
    padding:20px;  
    text-align:center;  
    box-shadow:0 0 20px #000;  
    position: relative;  
}  
  
h1{  
    margin-bottom:15px;  
}  
  
.info{  
    display:flex;  
    justify-content:space-between;  
    margin-bottom:10px;  
    font-size:18px;  
}  
  
#coin{  
    width:220px;  
    height:220px;  
    border-radius:50%;  
    cursor:pointer;  
    transition:.1s;  
    user-select:none;  
    object-fit:cover;  
    display:block;  
    margin:15px auto;  
}  
  
#coin:active{  
    transform:scale(.90);  
}  
  
#energyBar{  
    width:100%;  
    height:18px;  
    background:#555;  
    border-radius:20px;  
    overflow:hidden;  
    margin-top:12px;  
    margin-bottom:12px;  
}  
  
#energyFill{  
    width:100%;  
    height:100%;  
    background:lime;  
    transition:.2s;  
}  
  
button{  
    width:100%;  
    padding:12px;  
    margin-top:10px;  
    border:none;  
    border-radius:12px;  
    background:#ff9800;  
    color:white;  
    font-size:16px;  
    cursor:pointer;  
}  
  
button:hover{  
    background:#ffb300;  
}  
  
button:active{  
    transform:scale(.98);  
}  
  
#shop{  
    margin-top:20px;  
}  
  
.panel{  
    margin-top:20px;  
    padding:12px;  
    background:#2d2d2d;  
    border-radius:12px;  
    line-height:32px;  
}  
  
.levelBox{  
    background:#333;  
}  
  
.achievementBox{  
    background:#2b2b2b;  
}  
  
.rankBox{  
    background:#333;  
}  
  
/* --- استایل‌های کازینو (پاپ‌آپ و دکمه) --- */  
#openCasinoBtn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: linear-gradient(45deg, #ff0055, #ff9800);
    font-size: 32px;
    border: 2px solid white;
    box-shadow: 0 0 15px rgba(255, 152, 0, 0.8);
    z-index: 900;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    margin: 0;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 15px rgba(255,152,0,0.8); }
    50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(255,152,0,1); }
    100% { transform: scale(1); box-shadow: 0 0 15px rgba(255,152,0,0.8); }
}

#casinoModal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 9999;
    display: none; /* در ابتدا مخفی است */
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(5px);
}

.casinoBoxModal {
    background: linear-gradient(135deg, #2b0000, #4a0e0e);
    border: 2px solid #ff4444;
    border-radius: 20px;
    padding: 25px 20px;
    width: 360px;
    max-width: 90%;
    position: relative;
    text-align: center;
    box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
}

#closeCasinoBtn {
    position: absolute;
    top: 10px;
    right: 15px;
    background: transparent;
    border: none;
    font-size: 20px;
    color: white;
    width: auto;
    margin: 0;
    padding: 5px;
    box-shadow: none;
}
#closeCasinoBtn:hover { background: rgba(255,255,255,0.1); }

.casino-display {  
    font-size: 36px;  
    background: #111;  
    padding: 10px;  
    border-radius: 12px;  
    margin: 15px 0;  
    letter-spacing: 5px;  
    border: 1px dashed #ff9800;  
}  
  
.casino-input {  
    width: 100%;  
    padding: 12px;  
    border-radius: 8px;  
    border: 1px solid #555;  
    background: #111;  
    color: #fff;  
    font-size: 16px;  
    text-align: center;  
    margin-bottom: 10px;  
}  
  
.casino-btn {  
    background: linear-gradient(45deg, #e65100, #ff9800);  
    font-weight: bold;  
    font-size: 18px;  
    box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
}  
  
/* افکت پرتاب سکه */  
.flying-coin {  
    position: absolute;  
    pointer-events: none;  
    font-size: 22px;  
    font-weight: bold;  
    color: #ffd700;  
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);  
    z-index: 9999;  
    animation: floatUp 0.8s ease-out forwards;  
    user-select: none;  
}  

.flying-coin.golden {  
    font-size: 28px;  
    color: #fff700;  
    text-shadow: 0 0 15px #ffaa00, 0 0 25px #ffea00;  
    font-weight: 900;  
}  
  
@keyframes floatUp {  
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8) rotate(0deg); }  
    50% { transform: translate(calc(-50% + var(--dx)), calc(-50% - 60px)) scale(1.3) rotate(15deg); }  
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% - 120px)) scale(1) rotate(30deg); }  
}  
  
/* پیام خطا */  
#toastError {  
    position: fixed;  
    top: 20px;  
    left: 50%;  
    transform: translateX(-50%);  
    background-color: #e74c3c;  
    color: white;  
    padding: 10px 20px;  
    border-radius: 10px;  
    font-weight: bold;  
    font-size: 15px;  
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);  
    display: none;  
    z-index: 10000;  
    animation: fadeIn 0.3s;  
}  
  
@keyframes fadeIn {  
    from { opacity: 0; transform: translate(-50%, -10px); }  
    to { opacity: 1; transform: translate(-50%, 0); }  
}  
  
#progressBar{  
    height:16px;  
    background:#555;  
    border-radius:10px;  
    overflow:hidden;  
    margin-top:6px;  
}  
  
#progressFill{  
    height:100%;  
    width:0%;  
    background:#4caf50;  
}  
  
.small{  
    font-size:14px;  
    opacity:.7;  
}  
  
.upgrade-detail {  
    font-size: 13px;  
    color: #ffe0b2;  
    margin-top: 2px;  
}  
  
</style>  
</head>  
<body>  

<div id="toastError">⚠️ خطا!</div>  

<!-- دکمه شناور باز کردن کازینو -->
<button id="openCasinoBtn">🎰</button>

<!-- مدال (پاپ‌آپ) کازینو -->
<div id="casinoModal">
    <div class="casinoBoxModal">
        <button id="closeCasinoBtn">❌</button>
        <h3 style="margin-bottom:10px">🎰 کازینو و ریسک</h3>  
        <div class="casino-display" id="casinoSlots">🎰 🎰 🎰</div>  
        <input type="number" id="betAmount" class="casino-input" placeholder="مبلغ شرط (۱,۰۰۰ تا ۱,۰۰۰,۰۰۰)" min="1000" max="1000000">  
        <button id="spinCasinoBtn" class="casino-btn">🎲 چرخش گردونه!</button>  
        <div id="casinoResult" style="font-size:14px; margin-top:15px; color:#ffd700; font-weight:bold; min-height:20px;"></div>  
    </div>
</div>

<div id="game">  
    <h1>انگشتش کن!</h1>  

    <div class="info">  
        <div>🪙 <span id="coins">0</span></div>  
        <div>⭐سطح: <span id="stage">1</span></div>  
    </div>  

    <div class="info">  
        <div>⚡ <span id="energyText">100</span> / <span id="maxEnergyText">100</span></div>  
        <div>💥قدرت کلیک: <span id="power">1</span></div>  
    </div>  

    <div id="energyBar">  
        <div id="energyFill"></div>  
    </div>  

    <img id="coin" src="img1.jpg" alt="Coin">  

    <div id="shop">  

        <button id="upgradePower">  
            ⬆ افزایش سکه هر کلیک  
            <div class="upgrade-detail" id="powerDetail">قدرت: 1 ➔ 2</div>  
            <span id="powerPrice">20</span> سکه  
        </button>  

        <button id="upgradeEnergy">  
            🔋 افزایش ظرفیت انرژی  
            <div class="upgrade-detail" id="energyDetail">ظرفیت: 100 ➔ 120</div>  
            <span id="energyPrice">40</span> سکه  
        </button>  

        <button id="upgradeRegen">  
            ⚡ افزایش سرعت بازیابی انرژی  
            <div class="upgrade-detail" id="regenDetail">سرعت: 1/s ➔ 1.5/s</div>  
            <span id="regenPrice">60</span> سکه  
        </button>  

        <button id="upgradeGoldenChance" style="background: #d4af37;">  
            ✨ افزایش شانس کلیک طلایی  
            <div class="upgrade-detail" id="goldenChanceDetail">شانس: 0% ➔ 1%</div>  
            <span id="goldenChancePrice">50</span> سکه  
        </button>  

        <button id="upgradeGoldenMult" style="background: #b8860b;">  
            👑 افزایش ضریب کلیک طلایی  
            <div class="upgrade-detail" id="goldenMultDetail">ضریب: 2x ➔ 3x</div>  
            <span id="goldenMultPrice">100</span> سکه  
        </button>  

    </div>  

</div>  

<script>  
  
/* ==================================================  
   متغیرهای اصلی  
================================================== */  
let coins = 0;  
let stage = 1;  
let power = 1;  
let energy = 100;  
let maxEnergy = 100;  
let regen = 1;  

let goldenChance = 0;  
let goldenMult = 2;  
  
let powerPrice = 20;  
let energyPrice = 40;  
let regenPrice = 60;  
let goldenChancePrice = 50;  
let goldenMultPrice = 100;  
  
let powerLevel = 1;  
let energyLevel = 1;  
let regenLevel = 1;  
let goldenChanceLevel = 0;  
let goldenMultLevel = 1;  
  
let totalClicks = 0;  
let totalCoinsEarned = 0;  
let gameStart = Date.now();  
let buyAmount = 1;  
  
let achievements = {  
    firstClick:false, coin50:false, coin300:false, coin1000:false, coin5500:false, power10:false  
};  
  
let showAchievementAlerts = true;  
let rank = "حروم لقمه";  
  
/* ==================================================  
   عناصر HTML  
================================================== */  
const coin = document.getElementById("coin");  
const coinsText = document.getElementById("coins");  
const stageText = document.getElementById("stage");  
const energyText = document.getElementById("energyText");  
const maxEnergyText = document.getElementById("maxEnergyText");  
const energyFill = document.getElementById("energyFill");  
const powerText = document.getElementById("power");  
  
const powerPriceText = document.getElementById("powerPrice");  
const energyPriceText = document.getElementById("energyPrice");  
const regenPriceText = document.getElementById("regenPrice");  
const goldenChancePriceText = document.getElementById("goldenChancePrice");  
const goldenMultPriceText = document.getElementById("goldenMultPrice");  
  
const powerDetail = document.getElementById("powerDetail");  
const energyDetail = document.getElementById("energyDetail");  
const regenDetail = document.getElementById("regenDetail");  
const goldenChanceDetail = document.getElementById("goldenChanceDetail");  
const goldenMultDetail = document.getElementById("goldenMultDetail");  
  
const toastError = document.getElementById("toastError");  

// عناصر کازینو
const casinoModal = document.getElementById("casinoModal");
const openCasinoBtn = document.getElementById("openCasinoBtn");
const closeCasinoBtn = document.getElementById("closeCasinoBtn");
const betInput = document.getElementById("betAmount");
const spinCasinoBtn = document.getElementById("spinCasinoBtn");
const casinoSlots = document.getElementById("casinoSlots");
const casinoResult = document.getElementById("casinoResult");
let isSpinning = false;

/* ==================================================  
   مدیریت پاپ‌آپ کازینو  
================================================== */
openCasinoBtn.onclick = () => {
    casinoModal.style.display = 'flex';
    // آپدیت سکه در صورت نیاز هنگام باز شدن
    updateUI(); 
};

closeCasinoBtn.onclick = () => {
    casinoModal.style.display = 'none';
};

// اگر بازیکن بیرون از پنل کلیک کرد، بسته بشه
casinoModal.onclick = (e) => {
    if (e.target === casinoModal) {
        casinoModal.style.display = 'none';
    }
};

/* ==================================================  
   محاسبه هزینه‌ها  
================================================== */  
function calculateUpgradeStats(type) {  
    let cost = 0;  
    let tempPrice = (type === 'power') ? powerPrice : 
                    (type === 'energy') ? energyPrice : 
                    (type === 'regen') ? regenPrice : 
                    (type === 'goldenChance') ? goldenChancePrice : goldenMultPrice;  

    let tempVal = (type === 'power') ? power : 
                  (type === 'energy') ? maxEnergy : 
                  (type === 'regen') ? regen : 
                  (type === 'goldenChance') ? goldenChance : goldenMult;  
  
    for (let i = 0; i < buyAmount; i++) {  
        cost += tempPrice;  
        if (type === 'power') {  
            tempVal += 1;  
            tempPrice = Math.floor(tempPrice * 1.7);  
        } else if (type === 'energy') {  
            tempVal += 20;  
            tempPrice = Math.floor(tempPrice * 1.8);  
        } else if (type === 'regen') {  
            tempVal += 0.5;  
            tempPrice = Math.floor(tempPrice * 2);  
        } else if (type === 'goldenChance') {  
            tempVal += 1;  
            tempPrice = Math.floor(tempPrice * 1.9);  
        } else if (type === 'goldenMult') {  
            tempVal += 1;  
            tempPrice = Math.floor(tempPrice * 2.2);  
        }  
    }  
    return { totalCost: cost, nextVal: tempVal };  
}  
  
/* ==================================================  
   آپدیت رابط کاربری  
================================================== */  
function updateUI(){  
    coinsText.innerText = Math.floor(coins);  
    stageText.innerText = stage;  
    energyText.innerText = Math.floor(energy);  
    maxEnergyText.innerText = maxEnergy;  
    powerText.innerText = power;  
  
    const pStats = calculateUpgradeStats('power');  
    powerPriceText.innerText = pStats.totalCost;  
    powerDetail.innerText = `قدرت: ${power} ➔ ${pStats.nextVal}`;  
  
    const eStats = calculateUpgradeStats('energy');  
    energyPriceText.innerText = eStats.totalCost;  
    energyDetail.innerText = `ظرفیت: ${maxEnergy} ➔ ${eStats.nextVal}`;  
  
    const rStats = calculateUpgradeStats('regen');  
    regenPriceText.innerText = rStats.totalCost;  
    regenDetail.innerText = `سرعت: ${regen}/s ➔ ${rStats.nextVal}/s`;  

    const gcStats = calculateUpgradeStats('goldenChance');  
    goldenChancePriceText.innerText = gcStats.totalCost;  
    goldenChanceDetail.innerText = `شانس: ${goldenChance}% ➔ ${gcStats.nextVal}%`;  

    const gmStats = calculateUpgradeStats('goldenMult');  
    goldenMultPriceText.innerText = gmStats.totalCost;  
    goldenMultDetail.innerText = `ضریب: ${goldenMult}x ➔ ${gmStats.nextVal}x`;  
  
    let energyPercent = (energy / maxEnergy) * 100;  
    energyFill.style.width = energyPercent + "%";  
}  
  
/* ==================================================  
   نمایش خطای بالا صفحه  
================================================== */  
let errorTimeout;  
function showError(msg) {  
    toastError.innerText = msg;  
    toastError.style.display = "block";  
    clearTimeout(errorTimeout);  
    errorTimeout = setTimeout(() => {  
        toastError.style.display = "none";  
    }, 2000);  
}  
  
/* ==================================================  
   تغییر عکس سکه  
================================================== */  
function checkStage(){  
    if(coins >= 15000){ stage = 6; coin.src = "nezam.jpg"; }  
    else if(coins >= 5500){ stage = 5; coin.src = "gh.jpg"; }  
    else if(coins >= 1000){ stage = 4; coin.src = "sfr.jpg"; }  
    else if(coins >= 300){ stage = 3; coin.src = "ghafar.jpg"; }  
    else if(coins >= 50){ stage = 2; coin.src = "est.jpg"; }  
    else{ stage = 1; coin.src = "ghane.jpg"; }  
}  
  
/* ==================================================  
   صداها  
================================================== */  
function playClick(isGolden = false){  
    try{  
        const ctx = new (window.AudioContext || window.webkitAudioContext)();  
        const osc = ctx.createOscillator();  
        const gain = ctx.createGain();  
        osc.type = isGolden ? "sine" : "triangle";  
        osc.frequency.value = isGolden ? 1200 : 700;  
        gain.gain.value = isGolden ? 0.08 : 0.04;  
        osc.connect(gain);  
        gain.connect(ctx.destination);  
        osc.start();  
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (isGolden ? 0.2 : 0.08));  
        osc.stop(ctx.currentTime + (isGolden ? 0.2 : 0.08));  
    }catch(e){}  
}  

function playCasinoSound(isWin = false){
    try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = isWin ? "square" : "sawtooth";
        osc.frequency.value = isWin ? 900 : 250;
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
        osc.stop(ctx.currentTime + 0.3);
    }catch(e){}
}
  
/* ==================================================  
   افکت پرت شدن سکه با کلیک  
================================================== */  
function spawnFlyingCoin(e, earnedCoins, isGolden) {  
    const coinElem = document.createElement("div");  
    coinElem.className = isGolden ? "flying-coin golden" : "flying-coin";  
    coinElem.innerHTML = isGolden ? `✨ +${earnedCoins}` : `🪙 +${earnedCoins}`;  
      
    const rect = coin.getBoundingClientRect();  
    const gameRect = document.getElementById("game").getBoundingClientRect();  
  
    let clickX = (e.clientX || (rect.left + rect.width / 2)) - gameRect.left;  
    let clickY = (e.clientY || (rect.top + rect.height / 2)) - gameRect.top;  
  
    coinElem.style.left = clickX + "px";  
    coinElem.style.top = clickY + "px";  
      
    let randomDx = (Math.random() - 0.5) * 60;  
    coinElem.style.setProperty('--dx', `${randomDx}px`);  
  
    document.getElementById("game").appendChild(coinElem);  
  
    setTimeout(() => {  
        coinElem.remove();  
    }, 800);  
}  
  
/* ==================================================  
   منطق و مکانیزم کازینو 🎰 (با ایموجی‌های کلاسیک)
================================================== */  
spinCasinoBtn.onclick = function() {
    if(isSpinning) return;

    let bet = parseInt(betInput.value);

    if (isNaN(bet)) {
        showError("⚠️ لطفا مبلغ شرط را وارد کن!");
        return;
    }
    if (bet < 1000) {
        showError("⚠️ حداقل شرط ۱,۰۰۰ سکه‌ است!");
        return;
    }
    if (bet > 1000000) {
        showError("⚠️ حداکثر شرط ۱,۰۰۰,۰۰۰ سکه‌ است!");
        return;
    }
    if (coins < bet) {
        showError("⚠️ سکه کافی برای این شرط نداری!");
        return;
    }

    coins -= bet;
    updateUI();
    isSpinning = true;
    casinoResult.innerText = "در حال چرخیدن گردونه... 🎲";
    casinoResult.style.color = "#fff";

    const symbols = ["💀", "🍋", "🔔", "⭐", "💎", "7️⃣"];
    let counter = 0;

    let spinInterval = setInterval(() => {
        let s1 = symbols[Math.floor(Math.random() * symbols.length)];
        let s2 = symbols[Math.floor(Math.random() * symbols.length)];
        let s3 = symbols[Math.floor(Math.random() * symbols.length)];
        casinoSlots.innerText = `${s1} ${s2} ${s3}`;
        playCasinoSound(false);
        counter++;

        if (counter >= 15) {
            clearInterval(spinInterval);
            calculateCasinoOutcome(bet);
            isSpinning = false;
        }
    }, 80);
};

function calculateCasinoOutcome(bet) {
    let roll = Math.random() * 100;
    let multiplier = 0;
    let slotText = "";
    let message = "";
    let resultColor = "";

    if (roll < 35) {
        multiplier = 0;
        slotText = "💀 💀 💀";
        message = "💥 پوچ شد! تمام شرطت پرید!";
        resultColor = "#ff4444";
    } else if (roll < 60) {
        multiplier = 0.5;
        slotText = "🍋 🍋 💀";
        message = "📉 ضریب 0.5x - نصف شرطت برگشت.";
        resultColor = "#ff9800";
    } else if (roll < 75) {
        multiplier = 1;
        slotText = "🔔 🔔 🔔";
        message = "⚖️ ضریب 1x - اصل پولت برگشت.";
        resultColor = "#aaa";
    } else if (roll < 90) {
        multiplier = 1.5;
        slotText = "⭐ ⭐ ⭐";
        message = "✨ ضریب 1.5x - ۵۰٪ سود کردی!";
        resultColor = "#4caf50";
    } else if (roll < 98) {
        multiplier = 2;
        slotText = "💎 💎 💎";
        message = "🔥 ضریب 2x - شرطت دو برابر شد!";
        resultColor = "#00e5ff";
    } else {
        multiplier = 2.5;
        slotText = "7️⃣ 7️⃣ 7️⃣";
        message = "🎉 جک‌پات! ضریب 2.5x - برد فوق‌العاده!";
        resultColor = "#ffd700";
    }

    casinoSlots.innerText = slotText;
    let winCoins = Math.floor(bet * multiplier);
    coins += winCoins;

    if (winCoins > bet) {
        totalCoinsEarned += (winCoins - bet);
        playCasinoSound(true);
    }

    casinoResult.style.color = resultColor;
    casinoResult.innerText = `${message} (${winCoins} سکه)`;

    checkStage();
    checkAchievements();
    updateUI();
    updateStats();
    updateRank();
    updateProgress();
    saveGame();
}

function renderAchievements(){

    if(achievements.coin300) list.push("دریافت 300 سکه");

function addAchievement(text){

    if(showAchievementAlerts){  
        alert("🏆 دستاورد جدید!\n\n" + text);

function checkAchievements(){  
    let changed = false;  
    if(!achievements.firstClick && totalClicks >= 1){ achievements.firstClick = true; addAchievement("اولین کلیک"); changed = true; }  
    if(!achievements.coin50 && totalCoinsEarned >= 50){ achievements.coin50 = true; addAchievement("دریافت 50 سکه"); changed = true; }  
    if(!achievements.coin300 && totalCoinsEarned >= 300){ achievements.coin300 = true; addAchievement("دریافت 300 سکه"); changed = true; }  
    if(!achievements.coin1000 && totalCoinsEarned >= 1000){ achievements.coin1000 = true; addAchievement("دریافت 1000 سکه"); changed = true; }  
    if(!achievements.coin5500 && totalCoinsEarned >= 5500){ achievements.coin5500 = true; addAchievement("دریافت 5500 سکه"); changed = true; }  
    if(!achievements.power10 && power >= 10){ achievements.power10 = true; addAchievement("قدرت کلیک به ۱۰ رسید"); changed = true; }  
  
    renderAchievements();  
    if(changed) saveGame();  
}  
  
/* ==================================================  
   ذخیره / بارگذاری  
================================================== */  
function saveGame(){  
    const data = {  
        coins, stage, power, energy, maxEnergy, regen,  
        goldenChance, goldenMult,  
        powerPrice, energyPrice, regenPrice, goldenChancePrice, goldenMultPrice,  
        powerLevel, energyLevel, regenLevel, goldenChanceLevel, goldenMultLevel,  
        totalClicks, totalCoinsEarned, gameStart, achievements  
    };  
    localStorage.setItem("CoinClickerSave", JSON.stringify(data));  
}  
  
function loadGame(){  
    const saved = localStorage.getItem("CoinClickerSave");  
    if(!saved) return;  
    try{  
        const data = JSON.parse(saved);  
        coins = data.coins ?? 0;  
        stage = data.stage ?? 1;  
        power = data.power ?? 1;  
        energy = data.energy ?? 100;  
        maxEnergy = data.maxEnergy ?? 100;  
        regen = data.regen ?? 1;  

        goldenChance = data.goldenChance ?? 0;  
        goldenMult = data.goldenMult ?? 2;  

        powerPrice = data.powerPrice ?? 20;  
        energyPrice = data.energyPrice ?? 40;  
        regenPrice = data.regenPrice ?? 60;  
        goldenChancePrice = data.goldenChancePrice ?? 50;  
        goldenMultPrice = data.goldenMultPrice ?? 100;  

        powerLevel = data.powerLevel ?? 1;  
        energyLevel = data.energyLevel ?? 1;  
        regenLevel = data.regenLevel ?? 1;  
        goldenChanceLevel = data.goldenChanceLevel ?? 0;  
        goldenMultLevel = data.goldenMultLevel ?? 1;  

        totalClicks = data.totalClicks ?? 0;  
        totalCoinsEarned = data.totalCoinsEarned ?? 0;  
        gameStart = data.gameStart ?? Date.now();  
        achievements = {  
            firstClick: !!data.achievements?.firstClick,  
            coin50: !!data.achievements?.coin50,  
            coin300: !!data.achievements?.coin300,  
            coin1000: !!data.achievements?.coin1000,  
            coin5500: !!data.achievements?.coin5500,  
            power10: !!data.achievements?.power10  
        };  
    }catch(error){ console.log("خطا در بارگذاری ذخیره:", error); }  
}  
  
/* ==================================================  
   کلیک اصلی روی سکه  
================================================== */  
coin.onclick = function(e){  
    if(energy < 1){  
        showError("⚡ انرژی تموم شده!");  
        return;  
    }  

    let isGolden = false;  
    if(goldenChance > 0) {  
        let roll = Math.random() * 100;  
        if(roll < goldenChance) {  
            isGolden = true;  
        }  
    }  
  
    let earnedCoins = isGolden ? (power * goldenMult) : power;  

    playClick(isGolden);  
    spawnFlyingCoin(e, earnedCoins, isGolden);  
  
    energy -= 1;  
    coins += earnedCoins;  
    totalClicks++;  
    totalCoinsEarned += earnedCoins;  
  
    checkStage();  
    checkAchievements();  
    updateUI();  
    updateStats();  
    updateRank();  
    updateProgress();  
    saveGame();  
};  
  
/* ==================================================  
   خرید ارتقا  
================================================== */  
function buyUpgrade(type){  
    const reqStats = calculateUpgradeStats(type);  
      
    if (coins < reqStats.totalCost) {  
        showError("⚠️ سکه کافی نداری!");  
        return;  
    }  
  
    for(let i = 0; i < buyAmount; i++){  
        if(type === "power"){  
            coins -= powerPrice;  
            power++;  
            powerLevel++;  
            powerPrice = Math.floor(powerPrice * 1.7);  
        }  
        else if(type === "energy"){  
            coins -= energyPrice;  
            maxEnergy += 20;  
            energy = maxEnergy;  
            energyLevel++;  
            energyPrice = Math.floor(energyPrice * 1.8);  
        }  
        else if(type === "regen"){  
            coins -= regenPrice;  
            regen += 0.5;  
            regenLevel++;  
            regenPrice = Math.floor(regenPrice * 2);  
        }  
        else if(type === "goldenChance"){  
            coins -= goldenChancePrice;  
            goldenChance += 1;  
            goldenChanceLevel++;  
            goldenChancePrice = Math.floor(goldenChancePrice * 1.9);  
        }  
        else if(type === "goldenMult"){  
            coins -= goldenMultPrice;  
            goldenMult += 1;  
            goldenMultLevel++;  
            goldenMultPrice = Math.floor(goldenMultPrice * 2.2);  
        }  
    }  
  
    updateUI();  
    updateLevels();  
    updateRank();  
    updateProgress();  
    checkAchievements();  
    saveGame();  
}  
  
document.getElementById("upgradePower").onclick = () => buyUpgrade("power");  
document.getElementById("upgradeEnergy").onclick = () => buyUpgrade("energy");

document.getElementById("upgradeGoldenChance").onclick = () => buyUpgrade("goldenChance");

function getRankInfo(){  
    const ranks = [  
        {name:"حروم لقمه", start:0, end:50},  
        {name:"نیگا", start:50, end:300},  
        {name:"کصکش دو عالم", start:300, end:1000},  
        {name:"mr.26 kir", start:1000, end:5500},  
        {name:"ابر کونی", start:5500, end:10000},  
        {name:"سگ دست اموز قربانی", start:10000, end:15000},  
        {name:"سکه باز جنده", start:15000, end:30000},  
        {name:"خسته شو حاجی", start:25000, end:50000},  
        {name:"فراتر از یه کونی", start:50000, end:100000}  
    ];  
  
    for(let i = 0; i < ranks.length; i++){  
        if(coins < ranks[i].end) return ranks[i];  
    }  
    return { name:"خدای سکه", start:100000, end:100000, maxed:true };  
}  
  
function updateRank(){  
    const info = getRankInfo();  
    rankText.innerText = info.name;  
}  
  
function updateProgress(){  
    const info = getRankInfo();  
    if(info.maxed){  
        progressFill.style.width = "100%";  
        progressText.innerText = "100%";  
        return;  
    }  
    const range = info.end - info.start;  
    let percent = range > 0 ? ((coins - info.start) / range) * 100 : 100;  
    percent = Math.max(0, Math.min(100, percent));  
    progressFill.style.width = percent + "%";  
    progressText.innerText = Math.floor(percent) + "%";  
}

    input.accept = ".json";  
    input.onchange = function(e){  
        const file = e.target.files[0];  
        if(!file) return;  
        const reader = new FileReader();  
        reader.onload = function(){  
            try{  
                JSON.parse(reader.result);  
                localStorage.setItem("CoinClickerSave", reader.result);  
                loadGame();  
                checkStage();  
                updateUI();  
                updateStats();  
                updateLevels();  
                updateRank();  
                updateProgress();  
                renderAchievements();  
                alert("ذخیره بازی با موفقیت وارد شد.");  
            }catch(error){ alert("فایل ذخیره خراب یا نامعتبر است."); }  
        };  
        reader.readAsText(file);  
    };  
    input.click();  
};
