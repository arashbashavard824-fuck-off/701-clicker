<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>انگشتش کن!</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    overflow:auto;
    padding:20px 0;
}

#game{
    width:390px;
    max-width:95%;
    background:#222;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 20px #000;
    position:relative;
    overflow:hidden;
}

h1{
    margin-bottom:15px;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:18px;
}

#coin{
    width:220px;
    height:220px;
    border-radius:50%;
    cursor:pointer;
    transition:.1s;
    user-select:none;
    object-fit:cover;
    display:block;
    margin:15px auto;
}

#coin:active{
    transform:scale(.9);
}

#energyBar{
    width:100%;
    height:18px;
    background:#555;
    border-radius:20px;
    overflow:hidden;
    margin:12px 0;
}

#energyFill{
    width:100%;
    height:100%;
    background:lime;
    transition:.2s;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#ff9800;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#ffb300;
}

button:active{
    transform:scale(.98);
}

#shop{
    margin-top:20px;
}

.panel{
    margin-top:20px;
    padding:12px;
    background:#2d2d2d;
    border-radius:12px;
    line-height:32px;
}

.levelBox{
    background:#333;
}

.achievementBox{
    background:#2b2b2b;
}

.rankBox{
    background:#333;
}

.small{
    font-size:14px;
    opacity:.7;
}

.upgrade-detail{
    font-size:13px;
    color:#ffe0b2;
    margin-top:2px;
}

/* =========================
   BETA TAG
========================= */

.beta-btn{
    position:relative;
}

.beta-tag{
    display:inline-block;
    margin-right:6px;
    padding:2px 7px;
    border-radius:6px;
    background:#9c27ff;
    color:white;
    font-size:10px;
    font-weight:bold;
    line-height:18px;
    vertical-align:middle;
    box-shadow:0 0 8px #9c27ff;
}

/* =========================
   پیام خطا
========================= */

#toastError{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#e74c3c;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    font-weight:bold;
    font-size:15px;
    display:none;
    z-index:10000;
    box-shadow:0 4px 15px #0008;
}

/* =========================
   سکه پرتابی
========================= */

.flying-coin{
    position:absolute;
    pointer-events:none;
    font-size:22px;
    font-weight:bold;
    color:#ffd700;
    text-shadow:0 0 10px #000;
    z-index:9999;
    animation:floatUp .8s ease-out forwards;
    user-select:none;
}

@keyframes floatUp{

    0%{
        opacity:1;
        transform:
        translate(-50%,-50%)
        scale(.8)
        rotate(0);
    }

    50%{
        transform:
        translate(
            calc(-50% + var(--dx)),
            calc(-50% - 60px)
        )
        scale(1.3)
        rotate(15deg);
    }

    100%{
        opacity:0;
        transform:
        translate(
            calc(-50% + var(--dx)),
            calc(-50% - 120px)
        )
        scale(1)
        rotate(30deg);
    }

}

/* =========================
   افکت کلیک طلایی
========================= */

.gold-particle{
    position:absolute;
    pointer-events:none;
    z-index:10001;
    font-size:20px;
    animation:goldBurst 1.1s ease-out forwards;
}

@keyframes goldBurst{

    0%{
        opacity:1;
        transform:
        translate(0,0)
        scale(.4)
        rotate(0);
    }

    100%{
        opacity:0;
        transform:
        translate(var(--x),var(--y))
        scale(1.5)
        rotate(360deg);
    }

}

/* فلش طلایی کل صفحه */

#goldFlash{
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle,
            #fff8a8aa 0%,
            #ffd70033 35%,
            transparent 70%
        );
    pointer-events:none;
    opacity:0;
    z-index:9998;
}

#goldFlash.active{
    animation:flash .7s ease-out;
}

@keyframes flash{

    0%{
        opacity:0;
    }

    25%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}

/* =========================
   بنر کلیک طلایی
========================= */

#goldBanner{
    position:fixed;
    top:18%;
    left:50%;
    transform:
        translate(-50%,-20px)
        scale(.5);

    opacity:0;
    z-index:10002;
    pointer-events:none;
    text-align:center;
    font-weight:900;
    color:white;
}

#goldBanner.show{
    animation:
        goldBanner
        1.25s
        cubic-bezier(.2,1.4,.4,1)
        forwards;
}

.gold-title{
    font-size:38px;
    color:#ffd700;

    text-shadow:
        0 0 8px white,
        0 0 20px #ff9800,
        0 0 40px #ffd700;
}

.gold-reward{
    font-size:22px;
    margin-top:5px;

    text-shadow:
        0 0 12px #ff9800;
}

@keyframes goldBanner{

    0%{
        opacity:0;
        transform:
            translate(-50%,-20px)
            scale(.5);
    }

    25%{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1.15);
    }

    60%{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-35px)
            scale(1.05);
    }

}

/* =========================
   پنل آپدیت
========================= */

#updateOverlay{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:20000;
}

#updateOverlay.show{
    display:flex;
}

.update-card{
    width:390px;
    max-width:100%;
    padding:24px;
    border-radius:22px;
    text-align:center;

    background:
        linear-gradient(
            145deg,
            #17152d,
            #252044
        );

    border:1px solid #b65cff;

    box-shadow:
        0 0 18px #9c27ff,
        0 0 55px #4a148c;

    position:relative;
    overflow:hidden;
}

.update-card:before{
    content:"";
    position:absolute;
    inset:-50%;

    background:
        conic-gradient(
            transparent,
            #9c27ff33,
            transparent 25%
        );

    animation:spin 5s linear infinite;
}

.update-content{
    position:relative;
    z-index:1;
}

.update-icon{
    font-size:48px;
}

.update-card h2{
    color:#e0b3ff;
    font-size:27px;
    margin:8px 0;
}

.update-name{
    font-size:22px;
    color:white;
    margin-bottom:12px;
}

.update-card p{
    line-height:28px;
    color:#ddd;
}

.update-close{
    background:#9c27ff;
    margin-top:18px;
}

.update-close:hover{
    background:#b44cff;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   رتبه
========================= */

#progressBar{
    height:16px;
    background:#555;
    border-radius:10px;
    overflow:hidden;
    margin-top:6px;
}

#progressFill{
    height:100%;
    width:0%;
    background:#4caf50;
}

</style>

</head>

<body>

<!-- پیام خطا -->

<div id="toastError">
    ⚠️ سکه کافی نداری!
</div>

<!-- فلش کلیک طلایی -->

<div id="goldFlash"></div>

<!-- بنر کلیک طلایی -->

<div id="goldBanner">

    <div class="gold-title">
        ✨ کلیک طلایی! ✨
    </div>

    <div
        class="gold-reward"
        id="goldReward"

        +2
    </div>

</div>

<!-- =========================
     پنل بروزرسانی
========================= -->

<div id="updateOverlay">

            </div>

<div id="game">

    <h1>

</div>


<script>

/* ==================================================
   متغیرهای اصلی
================================================== */

let coins = 0;

let stage = 1;

let power = 1;

let energy = 100;

let maxEnergy = 100;

let regen = 1;


/* قیمت‌ها */

let powerPrice = 20;

let energyPrice = 40;

let regenPrice = 60;


/* سطح ارتقاها */

let powerLevel = 1;

let energyLevel = 1;

let regenLevel = 1;


/* ==================================================
   کلیک طلایی
================================================== */

let goldChance = 2;

let goldMultiplier = 2;

let goldChanceLevel = 1;

let goldMultiplierLevel = 1;

let goldChancePrice = 250;

let goldMultiplierPrice = 500;


/* ==================================================
   آمار
================================================== */

let totalClicks = 0;

let totalCoinsEarned = 0;

let totalGoldClicks = 0;

let gameStart = Date.now();


/* خرید چندتایی */

let buyAmount = 1;


/* دستاوردها */

let achievements = {

    firstClick:false,

    coin50:false,

    coin300:false,

    coin1000:false,

    coin5500:false,

    power10:false

};


let showAchievementAlerts = true;


/* رتبه */

let rank = "حروم لقمه";


/* ==================================================
   عناصر
================================================== */

const coin =
    document.getElementById("coin");

const coinsText =
    document.getElementById("coins");

const stageText =
    document.getElementById("stage");

const energyText =
    document.getElementById("energyText");

const maxEnergyText =
    document.getElementById("maxEnergyText");

const energyFill =
    document.getElementById("energyFill");

const powerText =
    document.getElementById("power");


const powerPriceText =
    document.getElementById("powerPrice");

const energyPriceText =
    document.getElementById("energyPrice");

const regenPriceText =
    document.getElementById("regenPrice");


const powerDetail =
    document.getElementById("powerDetail");

const energyDetail =
    document.getElementById("energyDetail");

const regenDetail =
    document.getElementById("regenDetail");


const goldChancePriceText =
    document.getElementById("goldChancePrice");

const goldMultiplierPriceText =
    document.getElementById("goldMultiplierPrice");


const goldChanceDetail =
    document.getElementById("goldChanceDetail");

const goldMultiplierDetail =
    document.getElementById("goldMultiplierDetail");


const toastError =
    document.getElementById("toastError");


/* ==================================================
   محاسبه قیمت ارتقا
================================================== */

function calculateUpgradeStats(type){

    let cost = 0;

    let tempPrice =
        type === "power"
        ? powerPrice

        : type === "energy"
        ? energyPrice

        : type === "regen"
        ? regenPrice

        : type === "goldChance"
        ? goldChancePrice

        : goldMultiplierPrice;


    let tempVal =
        type === "power"
        ? power

        : type === "energy"
        ? maxEnergy

        : type === "regen"
        ? regen

        : type === "goldChance"
        ? goldChance

        : goldMultiplier;


    for(
        let i = 0;
        i < buyAmount;
        i++
    ){

        cost += tempPrice;


        if(type === "power"){

            tempVal += 1;

            tempPrice =
                Math.floor(
                    tempPrice * 1.7
                );

        }


        else if(type === "energy"){

            tempVal += 20;

            tempPrice =
                Math.floor(
                    tempPrice * 1.8
                );

        }


        else if(type === "regen"){

            tempVal += 0.5;

            tempPrice =
                Math.floor(
                    tempPrice * 2
                );

        }


        else if(type === "goldChance"){

            tempVal =
                Math.min(
                    50,
                    tempVal + 1
                );

            tempPrice =
                Math.floor(
                    tempPrice * 2.05
                );

        }


        else{

            tempVal += 1;

            tempPrice =
                Math.floor(
                    tempPrice * 2.2
                );

        }

    }


    return {

        totalCost:cost,

        nextVal:tempVal

    };

}


/* ==================================================
   آپدیت رابط کاربری
================================================== */

function updateUI(){

    coinsText.innerText =
        Math.floor(coins);

    stageText.innerText =
        stage;

    energyText.innerText =
        Math.floor(energy);

    maxEnergyText.innerText =
        maxEnergy;

    powerText.innerText =
        power;


    /* قدرت */

    let p =
        calculateUpgradeStats(
            "power"
        );

    powerPriceText.innerText =
        p.totalCost;

    powerDetail.innerText =
        `قدرت: ${power} ➔ ${p.nextVal}`;


    /* انرژی */

    let e =
        calculateUpgradeStats(
            "energy"
        );

    energyPriceText.innerText =
        e.totalCost;

    energyDetail.innerText =
        `ظرفیت: ${maxEnergy} ➔ ${e.nextVal}`;


    /* ریکاوری */

    let r =
        calculateUpgradeStats(
            "regen"
        );

    regenPriceText.innerText =
        r.totalCost;

    regenDetail.innerText =
        `سرعت: ${regen}/s ➔ ${r.nextVal}/s`;


    /* شانس طلایی */

    let gc =
        calculateUpgradeStats(
            "goldChance"
        );

    goldChancePriceText.innerText =
        gc.totalCost;

    goldChanceDetail.innerText =
        `شانس: ${goldChance}% ➔ ${gc.nextVal}%`;


    /* ضریب طلایی */

    let gm =
        calculateUpgradeStats(
            "goldMultiplier"
        );

    goldMultiplierPriceText.innerText =
        gm.totalCost;

    goldMultiplier
