<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>انگشتش کن!</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:tahoma;
}

body{

    background:#111;

    color:white;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    min-height:100vh;

    overflow:auto;

    padding:20px 0;

}

#game{

    width:390px;

    max-width:95%;

    background:#222;

    border-radius:20px;

    padding:20px;

    text-align:center;

    box-shadow:0 0 20px #000;

}

h1{

    margin-bottom:15px;

}

.info{

    display:flex;

    justify-content:space-between;

    margin-bottom:10px;

    font-size:18px;

}

#coin{

    width:220px;

    height:220px;

    border-radius:50%;

    cursor:pointer;

    transition:.1s;

    user-select:none;

    object-fit:cover;

    display:block;

    margin:15px auto;

}

#coin:active{

    transform:scale(.90);

}

#energyBar{

    width:100%;

    height:18px;

    background:#555;

    border-radius:20px;

    overflow:hidden;

    margin-top:12px;

    margin-bottom:12px;

}

#energyFill{

    width:100%;

    height:100%;

    background:lime;

    transition:.2s;

}

button{

    width:100%;

    padding:12px;

    margin-top:10px;

    border:none;

    border-radius:12px;

    background:#ff9800;

    color:white;

    font-size:18px;

    cursor:pointer;

}

button:hover{

    background:#ffb300;

}

button:active{

    transform:scale(.98);

}

#shop{

    margin-top:20px;

}

.panel{

    margin-top:20px;

    padding:12px;

    background:#2d2d2d;

    border-radius:12px;

    line-height:32px;

}

.levelBox{

    background:#333;

}

.achievementBox{

    background:#2b2b2b;

}

.rankBox{

    background:#333;

}

#popup{

    position:fixed;

    pointer-events:none;

    display:none;

    color:gold;

    font-size:26px;

    font-weight:bold;

    text-shadow:0 0 8px black;

    z-index:9999;

}

#progressBar{

    height:16px;

    background:#555;

    border-radius:10px;

    overflow:hidden;

    margin-top:6px;

}

#progressFill{

    height:100%;

    width:0%;

    background:#4caf50;

}

.small{

    font-size:14px;

    opacity:.7;

}

</style>

</head>


<body>

<div id="game">

    <h1>انگشتش کن!</h1>


    <div class="info">

        <div>

            🪙

            <span id="coins">0</span>

        </div>

        <div>

            ⭐سطح:

            <span id="stage">1</span>

        </div>

    </div>


    <div class="info">

        <div>

            ⚡

            <span id="energyText">100</span>

            /

            <span id="maxEnergyText">100</span>

        </div>

        <div>

            💥قدرت کلیک:

            <span id="power">1</span>

        </div>

    </div>


    <div id="energyBar">

        <div id="energyFill"></div>

    </div>


    <img

        id="coin"

        src="img1.jpg"

        alt="Coin"

    >


    <div id="shop">

        <button id="upgradePower">

            ⬆ افزایش سکه هر کلیک

            <br>

            <span id="powerPrice">20</span>

            سکه

        </button>


        <button id="upgradeEnergy">

            🔋 افزایش ظرفیت انرژی

            <br>

            <span id="energyPrice">40</span>

            سکه

        </button>


        <button id="upgradeRegen">

            ⚡ افزایش سرعت بازیابی انرژی

            <br>

            <span id="regenPrice">60</span>

            سکه

        </button>

    </div>

</div>


<div id="popup"></div>


<script>

/* ==================================================
   متغیرهای اصلی
================================================== */

let coins = 0;

let stage = 1;

let power = 1;

let energy = 100;

let maxEnergy = 100;

let regen = 1;

let powerPrice = 20;

let energyPrice = 40;

let regenPrice = 60;


/* ==================================================
   سطح ارتقاها
================================================== */

let powerLevel = 1;

let energyLevel = 1;

let regenLevel = 1;


/* ==================================================
   آمار
================================================== */

let totalClicks = 0;

let totalCoinsEarned = 0;

let gameStart = Date.now();


/* ==================================================
   خرید چندتایی
================================================== */

let buyAmount = 1;


/* ==================================================
   دستاوردها
================================================== */

let achievements = {

    firstClick:false,

    coin50:false,

    coin300:false,

    coin1000:false,

    coin5500:false,

    power10:false

};


/* ==================================================
   رتبه
================================================== */

let rank = "حروم لقمه";


/* ==================================================
   عناصر HTML
================================================== */

const coin = document.getElementById("coin");

const coinsText = document.getElementById("coins");

const stageText = document.getElementById("stage");

const energyText = document.getElementById("energyText");

const maxEnergyText =
document.getElementById("maxEnergyText");

const energyFill =
document.getElementById("energyFill");

const powerText =
document.getElementById("power");

const powerPriceText =
document.getElementById("powerPrice");

const energyPriceText =
document.getElementById("energyPrice");

const regenPriceText =
document.getElementById("regenPrice");

const popup =
document.getElementById("popup");


/* ==================================================
   آپدیت رابط کاربری
================================================== */

function updateUI(){

    coinsText.innerText = coins;

    stageText.innerText = stage;

    energyText.innerText = Math.floor(energy);

    maxEnergyText.innerText = maxEnergy;

    powerText.innerText = power;

    powerPriceText.innerText = powerPrice;

    energyPriceText.innerText = energyPrice;

    regenPriceText.innerText = regenPrice;

    let energyPercent =
        (energy / maxEnergy) * 100;

    energyFill.style.width =
        energyPercent + "%";

}


/* ==================================================
   تغییر عکس سکه
================================================== */

function checkStage(){

    if(coins >= 5500){

        stage = 5;

        coin.src = "gh.jpg";

    }

    else if(coins >= 1000){

        stage = 4;

        coin.src = "sfr.jpg";

    }

    else if(coins >= 300){

        stage = 3;

        coin.src = "ghafar.jpg";

    }

    else if(coins >= 50){

        stage = 2;

        coin.src = "est.jpg";

    }

    else{

        stage = 1;

        coin.src = "ghane.jpg";

    }

}


/* ==================================================
   صدای کلیک
================================================== */

function playClick(){

    try{

        const ctx =
            new (window.AudioContext ||
            window.webkitAudioContext)();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = "triangle";

        osc.frequency.value = 700;

        gain.gain.value = 0.04;

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        gain.gain.exponentialRampToValueAtTime(

            0.0001,

            ctx.currentTime + 0.08

        );

        osc.stop(

            ctx.currentTime + 0.08

        );

    }

    catch(e){

        console.log("Audio error:",e);

    }

}


/* ==================================================
   نمایش + سکه
================================================== */

function showCoinText(){

    const rect =
        coin.getBoundingClientRect();

    popup.style.display = "block";

    popup.innerHTML =
        "+" + power + " 🪙";

    popup.style.left =
        (rect.left + rect.width / 2 - 30) + "px";

    popup.style.top =
        (rect.top + 40) + "px";

    let y = rect.top + 40;

    let opacity = 1;

    const anim =
        setInterval(function(){

            y -= 2;

            opacity -= 0.03;

            popup.style.top =
                y + "px";

            popup.style.opacity =
                opacity;

            if(opacity <= 0){

                clearInterval(anim);

                popup.style.display = "none";

                popup.style.opacity = 1;

            }

        },20);

}


/* ==================================================
   پیام تغییر مرحله
================================================== */

let lastStage = stage;

function stageMessage(){

    if(stage !== lastStage){

        lastStage = stage;

    }

}


/* ==================================================
   پنل آمار
================================================== */

const stats = document.createElement("div");

stats.className = "panel";

stats.innerHTML = `

<h3>📊 آمار بازی</h3>

<div>

🖱️ تعداد کلیک:

<span id="clickCount">0</span>

</div>

<div>

🪙 مجموع سکه دریافتی:

<span id="coinCount">0</span>

</div>

<div>

⏳ زمان بازی:

<span id="timePlayed">0</span>

ثانیه(صفحه رو رفرش کن)

</div>

`;

document.getElementById("game")
.appendChild(stats);


const clickCount =
document.getElementById("clickCount");

const coinCount =
document.getElementById("coinCount");

const timePlayed =
document.getElementById("timePlayed");


function updateStats(){

    clickCount.innerText =
        totalClicks;

    coinCount.innerText =
        totalCoinsEarned;

    let seconds =
        Math.floor(
            (Date.now() - gameStart) / 1000
        );

    timePlayed.innerText =
        seconds;

}


/* ==================================================
   سطح ارتقاها
================================================== */

const levelBox =
document.createElement("div");

levelBox.className =
    "panel levelBox";

levelBox.innerHTML = `

<h3>🏪 سطح ارتقاها</h3>

<div>

💥 قدرت کلیک:

<span id="powerLevel">1</span>

</div>

<div>

🔋 ظرفیت انرژی:

<span id="energyLevel">1</span>

</div>

<div>

⚡ سرعت بازیابی:

<span id="regenLevel">1</span>

</div>

`;

document.getElementById("shop")
.appendChild(levelBox);


const powerLevelText =
document.getElementById("powerLevel");

const energyLevelText =
document.getElementById("energyLevel");

const regenLevelText =
document.getElementById("regenLevel");


function updateLevels(){

    powerLevelText.innerText =
        powerLevel;

    energyLevelText.innerText =
        energyLevel;

    regenLevelText.innerText =
        regenLevel;

}


/* ==================================================
   دستاوردها
================================================== */

const achievementBox =
document.createElement("div");

achievementBox.className =
    "panel achievementBox";

achievementBox.innerHTML = `

<h3>🏆 دستاوردها</h3>

<div id="achievementList">

هنوز دستاوردی نگرفتی.

</div>

`;

document.getElementById("game")
.appendChild(achievementBox);


const achievementList =
document.getElementById("achievementList");


function addAchievement(text){

    if(
        achievementList.innerHTML ===
        "هنوز دستاوردی نگرفتی."
    ){

        achievementList.innerHTML = "";

    }

    achievementList.innerHTML +=
        "<div>✅ " +
        text +
        "</div>";

    alert(
        "🏆 دستاورد جدید!\n\n" +
        text
    );

}


function checkAchievements(){

    if(
        !achievements.firstClick &&
        totalClicks >= 1
    )


    if(
        !achievements.coin50 &&
        coins >= 50
    ){

        achievements.coin50 = true;

        addAchievement(
            "جمع‌آوری 50 سکه"
        );

    }


    if(
        !achievements.coin300 &&
        coins >= 300
    ){

        achievements.coin300 = true;

        addAchievement(
            "جمع‌آوری 300 سکه"
        );

    }


    if(
        !achievements.coin1000 &&
        coins >= 1000
    ){

        achievements.coin1000 = true;

        addAchievement(
            "جمع‌آوری 1000 سکه"
        );

    }


    if(
        !achievements.coin1000 &&
        coins >= 5500
    ){

        achievements.coin5500 = true;

        addAchievement(
            "جمع‌آوری 5500 سکه"
        );

    }


    if(
        !achievements.power10 &&
        power >= 10
    ){

        achievements.power10 = true;

        addAchievement(
            "قدرت کلیک به ۱۰ رسید"
        );

    }

}


/* ==================================================
   ذخیره بازی
================================================== */

function saveGame(){

    const data = {

        coins,

        stage,

        power,

        energy,

        maxEnergy,

        regen,

        powerPrice,

        energyPrice,

        regenPrice,

        powerLevel,

        energyLevel,

        regenLevel,

        totalClicks,

        totalCoinsEarned,

        gameStart,

        achievements

    };

    localStorage.setItem(

        "CoinClickerSave",

        JSON.stringify(data)

    );

}


/* ==================================================
   بارگذاری بازی
================================================== */

function loadGame(){

    const saved =
        localStorage.getItem(
            "CoinClickerSave"
        );

    if(!saved){

        return;

    }

    try{

        const data =
            JSON.parse(saved);

        coins =
            data.coins ?? 0;

        stage =
            data.stage ?? 1;

        power =
            data.power ?? 1;

        energy =
            data.energy ?? 100;

        maxEnergy =
            data.maxEnergy ?? 100;

        regen =
            data.regen ?? 1;

        powerPrice =
            data.powerPrice ?? 20;

        energyPrice =
            data.energyPrice ?? 40;

        regenPrice =
            data.regenPrice ?? 60;

        powerLevel =
            data.powerLevel ?? 1;

        energyLevel =
            data.energyLevel ?? 1;

        regenLevel =
            data.regenLevel ?? 1;

        totalClicks =
            data.totalClicks ?? 0;

        totalCoinsEarned =
            data.totalCoinsEarned ?? 0;

        gameStart =
            data.gameStart ?? Date.now();

        achievements =
            data.achievements ??
            achievements;

    }

    catch(error){

        console.log(
            "خطا در بارگذاری ذخیره:",
            error
        );

    }

}


/* ==================================================
   کلیک اصلی روی سکه
================================================== */

coin.onclick = function(){

    if(energy < 1){

        return;

    }

    playClick();

    energy -= 1;

    coins += power;

    totalClicks++;

    totalCoinsEarned += power;

    showCoinText();

    checkStage();

    stageMessage();

    checkAchievements();

    updateUI();

    updateStats();

    updateRank();

    updateProgress();

    saveGame();

};


/* ==================================================
   تابع خرید ارتقا
================================================== */

function buyUpgrade(type){

    for(
        let i = 0;
        i < buyAmount;
        i++
    ){

        if(type === "power"){

            if(coins < powerPrice){

                break;

            }

            coins -= powerPrice;

            power++;

            powerLevel++;

            powerPrice =
                Math.floor(
                    powerPrice * 1.7
                );

        }


        else if(type === "energy"){

            if(coins < energyPrice){

                break;

            }

            coins -= energyPrice;

            maxEnergy += 20;

            energy = maxEnergy;

            energyLevel++;

            energyPrice =
                Math.floor(
                    energyPrice * 1.8
                );

        }


        else if(type === "regen"){

            if(coins < regenPrice){

                break;

            }

            coins -= regenPrice;

            regen += 0.5;

            regenLevel++;

            regenPrice =
                Math.floor(
                    regenPrice * 2
                );

        }

    }

    updateUI();

    updateLevels();

    updateRank();

    updateProgress();

    checkAchievements();

    saveGame();

}


/* ==================================================
   اتصال دکمه های ارتقا
================================================== */

document.getElementById(
    "upgradePower"
).onclick = function(){

    buyUpgrade("power");

};


document.getElementById(
    "upgradeEnergy"
).onclick = function(){

    buyUpgrade("energy");

};


document.getElementById(
    "upgradeRegen"
).onclick = function(){

    buyUpgrade("regen");

};


/* ==================================================
   شارژ انرژی
================================================== */

setInterval(function(){

    if(energy < maxEnergy){

        energy += regen / 10;

        if(energy > maxEnergy){

            energy = maxEnergy;

        }

        updateUI();

    }

},100);


/* ==================================================
   پنل خرید چندتایی
================================================== */

const buyBox =
    document.createElement("div");

buyBox.className =
    "panel";

buyBox.innerHTML = `

<h3>🛒 حالت خرید</h3>

<button id="buy1">×1</button>

<button id="buy5">×5</button>

<button id="buy10">×10</button>

<div>

حالت فعلی:

<span id="buyAmountText">×1</span>

</div>

`;

document.getElementById("shop")
.appendChild(buyBox);


const buyAmountText =
    document.getElementById(
        "buyAmountText"
    );


document.getElementById(
    "buy1"
).onclick = function(){

    buyAmount = 1;

    buyAmountText.innerText =
        "×1";

};


document.getElementById(
    "buy5"
).onclick = function(){

    buyAmount = 5;

    buyAmountText.innerText =
        "×5";

};


document.getElementById(
    "buy10"
).onclick = function(){

    buyAmount = 10;

    buyAmountText.innerText =
        "×10";

};


/* ==================================================
   پاداش روزانه
================================================== */

const dailyBox =
    document.createElement("div");

dailyBox.className =
    "panel";

dailyBox.innerHTML = `

<h3>🎁 پاداش روزانه</h3>

<button id="dailyReward">

دریافت 100 سکه

</button>

`;

document.getElementById("game")
.appendChild(dailyBox);


document.getElementById(
    "dailyReward"
).onclick = function(){

    const today =
        new Date().toDateString();

    const last =
        localStorage.getItem(
            "dailyReward"
        );

    if(last === today){

        alert(
            "امروز پاداشت را گرفته‌ای."
        );

        return;

    }

    coins += 100;

    localStorage.setItem(
        "dailyReward",
        today
    );

    checkStage();

    checkAchievements();

    updateUI();

    updateRank();

    updateProgress();

    saveGame();

    alert(
        "🎉 100 سکه دریافت کردی."
    );

};



/* ==================================================
   رتبه بازیکن
================================================== */

const rankBox =
    document.createElement("div");

rankBox.className =
    "panel rankBox";

rankBox.innerHTML = `

<h3>👑 رتبه بازیکن</h3>

<div>

رتبه:

<span id="rankText">
حروم لقمه
</span>

</div>

<div style="margin-top:10px">

مرحله بعد

<div id="progressBar">

<div id="progressFill"></div>

</div>

<span id="progressText">
0%
</span>

</div>

`;

document.getElementById("game")
.appendChild(rankBox);


const rankText =
    document.getElementById(
        "rankText"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const progressText =
    document.getElementById(
        "progressText"
    );


function updateRank(){

    if(coins < 50){

        rank = "حروم لقمه";

    }

    else if(coins < 300){

        rank = "نیگا";

    }

    else if(coins < 1000){

        rank = "کصکش دو عالم";

    }

    else if(coins < 5500){

        rank = "mr.26 kir";

    }

    else if(coins < 10000){

        rank = "ابر کونی";

    }

    else if(coin < 15000){

        rank = "مورد امرزش صفار";

    }

    rankText.innerText =
        rank;

}


function updateProgress(){

    let start = 0;

    let end = 50;


    if(stage === 1){

        start = 0;

        end = 50;

    }

    else if(stage === 2){

        start = 50;

        end = 300;

    }

    else if(stage === 3){

        start = 300;

        end = 1000;

    }

    else if(stage === 4){

        start = 1000;

        end = 5500;

    }

    else if(stage === 5){

        start = 5500;

        end = 10000;

    }


    let percent =
        ((coins - start) /
        (end - start)) * 100;


    if(percent > 100){

        percent = 100;

    }

    if(percent < 0){

        percent = 0;

    }


    progressFill.style.width =
        percent + "%";

    progressText.innerText =
        Math.floor(percent) + "%";

}


/* ==================================================
   ذخیره خودکار
================================================== */

setInterval(function(){

    saveGame();

},3000);


/* ==================================================
   پاداش خودکار هر دقیقه
================================================== */

let autoReward = 5;

setInterval(function(){

    coins += autoReward;

    checkStage();

    checkAchievements();

    updateUI();

    updateRank();

    updateProgress();

    saveGame();

},60000);


/* ==================================================
   دکمه ذخیره
================================================== */

const saveButton =
    document.createElement("button");

saveButton.innerText =
    "💾 ذخیره بازی";

saveButton.onclick =
    function(){

        saveGame();

        alert(
            "بازی ذخیره شد."
        );

    };

document.getElementById("shop")
.appendChild(saveButton);


/* ==================================================
   دکمه بارگذاری
================================================== */

const loadButton =
    document.createElement("button");

loadButton.innerText =
    "📂 بارگذاری بازی";

loadButton.onclick =
    function(){

        loadGame();

        checkStage();

        updateUI();

        updateStats();

        updateLevels();

        updateRank();

        updateProgress();

        alert(
            "بازی بارگذاری شد."
        );

    };

document.getElementById("shop")
.appendChild(loadButton);


/* ==================================================
   خروجی ذخیره
================================================== */

const exportBtn =
    document.createElement("button");

exportBtn.innerText =
    "📤 خروجی ذخیره";

exportBtn.onclick =
    function(){

        const data =
            localStorage.getItem(
                "CoinClickerSave"
            );

        if(!data){

            alert(
                "ذخیره‌ای وجود ندارد."
            );

            return;

        }

        const blob =
            new Blob(
                [data],
                {
                    type:
                    "application/json"
                }
            );

        const a =
            document.createElement("a");

        a.href =
            URL.createObjectURL(blob);

        a.download =
            "CoinClickerSave.json";

        a.click();

        URL.revokeObjectURL(
            a.href
        );

    };

document.getElementById("shop")
.appendChild(exportBtn);


/* ==================================================
   وارد کردن ذخیره
================================================== */

const importBtn =
    document.createElement("button");

importBtn.innerText =
    "📥 وارد کردن ذخیره";

importBtn.onclick =
    function(){

        const input =
            document.createElement("input");

        input.type = "file";

        input.accept = ".json";

        input.onchange =
            function(e){

                const file =
                    e.target.files[0];

                if(!file){

                    return;

                }

                const reader =
                    new FileReader();

                reader.onload =
                    function(){

                        try{

                            JSON.parse(
                                reader.result
                            );

                            localStorage.setItem(

                                "CoinClickerSave",

                                reader.result

                            );

                            loadGame();

                            checkStage();

                            updateUI();

                            updateStats();

                            updateLevels();

                            updateRank();

                            updateProgress();

                            alert(
                                "ذخیره بازی با موفقیت وارد شد."
                            );

                        }

                        catch(error){

                            alert(
                                "فایل ذخیره خراب یا نامعتبر است."
                            );

                        }

                    };

                reader.readAsText(file);

            };

        input.click();

    };

document.getElementById("shop")
.appendChild(importBtn);
